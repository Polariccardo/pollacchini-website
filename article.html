<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — Riccardo Pollacchini</title>

  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://pollacchini.com/" />
  <meta property="og:image" content="https://pollacchini.com/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #111110;
      --paper: #F7F5F0;
      --accent: #2E2EFF;
      --accent-light: #EDEDFF;
      --yellow: #FFFF00;
      --muted: #7A7870;
      --border: #E2DFD8;
      --card: #FFFFFF;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 48px;
      background: rgba(247, 245, 240, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .back-btn-round {
      width: 40px; height: 40px; border-radius: 50%;
      background: transparent;
      border: 2px solid var(--accent, #2E2EFF);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
      transition: transform 0.15s, background 0.2s;
      flex-shrink: 0;
    }
    .back-btn-round:hover { background: var(--yellow, #FFFF00); transform: translateX(-2px); }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 700;
      color: var(--ink); text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav-logo span { color: var(--accent); }

    .article-wrapper {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 48px 100px;
    }

    .article-eyebrow {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 20px;
    }
    .article-eyebrow::after {
      content: ''; flex: 1; max-width: 60px;
      height: 1px; background: var(--yellow);
    }

    .article-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .article-meta {
      display: flex; align-items: center; gap: 20px;
      font-size: 13px; color: var(--muted);
      margin-bottom: 56px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }
    .article-meta .cat {
      color: var(--accent); font-weight: 500;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    }

    .article-body {
      font-size: 17px;
      line-height: 1.85;
      color: #2A2A28;
    }
    .article-body p { margin-bottom: 24px; }
    .article-body a { color: var(--accent); text-decoration: none; font-weight: 400; }
    .article-body a:hover { text-decoration: underline; }
    .article-references { margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); }
    .article-references-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
    .article-references-list { list-style: decimal; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
    .article-references-list li { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .article-references-list a { color: var(--accent); text-decoration: none; }
    .article-references-list a:hover { text-decoration: underline; }
    .article-body h2 {
      font-family: var(--font-display);
      font-size: 26px; font-weight: 700;
      letter-spacing: -0.02em; color: var(--ink);
      margin: 48px 0 16px; line-height: 1.2;
    }
    .article-body h3 {
      font-family: var(--font-display);
      font-size: 20px; font-weight: 700;
      color: var(--ink); margin: 36px 0 12px;
    }
    .article-body strong { color: var(--ink); font-weight: 500; }
    .article-body em { font-style: italic; color: var(--ink); }
    .article-title .hl span, .art-title .hl span { display: inline; }
    .article-title em, .art-title em { font-style: italic; color: var(--accent); font-family: var(--font-display); font-weight: 900; }
    .article-title .hl, .art-title .hl { background: var(--yellow); color: var(--ink); padding: 0 4px; font-style: normal; display: inline; -webkit-box-decoration-break: clone; box-decoration-break: clone; line-height: 1; }
    .article-body .highlight { font-weight: 500; color: var(--ink); background: none; padding: 0; }
    .author-signature {
      margin-top: 64px;
      padding: 36px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex; flex-direction: column; gap: 0;
    }
    .author-top {
      display: flex; align-items: center; gap: 28px;
      margin-bottom: 24px;
    }
    .author-cta-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
      padding-top: 20px; border-top: 1px solid var(--border);
    }
    .author-cta-label {
      font-size: 14px; color: var(--muted); line-height: 1.5;
    }
    .author-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--yellow);
      border: 3px solid var(--yellow);
      flex-shrink: 0;
      overflow: hidden;
    }
    .author-avatar img {
      width: 100%; height: 100%; object-fit: cover; object-position: center 15%;
    }
    .author-info { flex: 1; }
    .author-name {
      font-family: var(--font-display);
      font-size: 22px; font-weight: 700;
      letter-spacing: -0.02em; color: var(--ink);
      margin-bottom: 4px;
    }
    .author-desc {
      font-size: 14px; color: var(--muted);
      line-height: 1.6; margin-bottom: 14px;
    }
    .author-linkedin {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--accent);
      text-decoration: none; transition: opacity 0.2s;
    }
    .author-linkedin:hover { opacity: 0.75; }

    /* ── MORE ARTICLES ── */
    .more-section {
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    .more-eyebrow {
      font-family: var(--font-mono); font-size: 11px;
      color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 24px;
    }
    .more-articles-list { display: flex; flex-direction: column; gap: 0; }
    .more-article-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; padding: 20px 0;
      border-bottom: 1px solid var(--border);
      text-decoration: none; color: inherit;
      transition: color 0.2s;
    }
    .more-article-row:first-child { border-top: 1px solid var(--border); }
    .more-article-row:hover .more-article-title { color: var(--accent); }
    .more-article-title {
      font-family: var(--font-display); font-size: 18px;
      font-weight: 700; color: var(--ink);
      letter-spacing: -0.02em; line-height: 1.2;
      transition: color 0.2s;
    }
    .more-article-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .more-article-arrow { color: var(--accent); font-size: 18px; flex-shrink: 0; }

    .author-cta-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff;
      padding: 10px 20px; border-radius: 4px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; text-decoration: none;
      margin-top: 14px;
      transition: background 0.2s, transform 0.15s;
    }
    .author-cta-btn:hover { background: #1a1acc; transform: translateY(-1px); }

    .state-message {
      text-align: center; padding: 80px 0;
      color: var(--muted); font-size: 16px;
    }
    .state-message h2 {
      font-family: var(--font-display);
      font-size: 32px; font-weight: 700;
      color: var(--ink); margin-bottom: 12px;
    }

    @media (max-width: 900px) {
      nav { padding: 16px 24px; }
      .article-wrapper { padding: 40px 24px 60px; }
      .author-top { flex-direction: column; text-align: center; }
      .author-avatar { margin: 0 auto; }
      .author-cta-row { flex-direction: column; align-items: center; text-align: center; }
      .author-cta-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/#articles" class="back-btn-round" aria-label="Back"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E2EFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <a href="/" class="nav-logo">R<span style="color:#2E2EFF;">P</span></a>
</nav>

<div class="article-wrapper" id="article-wrapper">
  <div class="state-message" id="loading">
    <p>Loading article…</p>
  </div>
</div>

<script>
  function formatDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function clientDecodeTags(text) {
    if (!text) return text;
    return text
      .replace(/\[em\]/g, '<em>')
      .replace(/\[\/em\]/g, '</em>')
      .replace(/\[hl\]/g, '<span class="hl"><span>')
      .replace(/\[\/hl\]/g, '</span></span>')
      .replace(/\[link url=([^\]]+)\](.*?)\[\/link\]/g, '<a href="$1" target="_blank">$2</a>');
  }

  function formatBody(text) {
    if (!text) return '';
    const paragraphs = text.split('\n').filter(p => p.trim().length > 0);
    const refIdx = paragraphs.findIndex(p => /^(REFERENCES|References:?)$/i.test(p.trim()));
    const bodyParagraphs = refIdx >= 0 ? paragraphs.slice(0, refIdx) : paragraphs;
    const refParagraphs = refIdx >= 0 ? paragraphs.slice(refIdx + 1) : [];

    let html = bodyParagraphs.map(p => {
      const raw = p.trim();
      const decoded = clientDecodeTags(raw);
      if (raw === raw.toUpperCase() && raw.split(' ').length >= 3 && raw.length > 10) {
        const titled = raw.split(' ').map(w => w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
        return '<h2>' + titled + '</h2>';
      }
      if (/^(Layer \d|Base Layer|Middle Layer|Top Layer|First,|Second,|Third,)/.test(raw)) {
        return '<h3>' + decoded + '</h3>';
      }
      return '<p>' + decoded + '</p>';
    }).join('\n');

    if (refParagraphs.length > 0) {
      const items = refParagraphs.map(r => '<li>' + clientDecodeTags(r.trim().replace(/^\d+\.\s*/, '')) + '</li>').join('');
      html += '<div class="article-references"><div class="article-references-title">References</div><ol class="article-references-list">' + items + '</ol></div>';
    }

    return html;
  }

  function renderMoreArticles(articles, currentSlug) {
    const others = articles.filter(a => a.slug !== currentSlug).slice(0, 3);
    if (!others.length) return '';
    const rows = others.map(a => `
      <a class="more-article-row" href="/article?slug=${a.slug}">
        <div>
          <div class="more-article-title">${a.title.replace(/<[^>]+>/g, '')}</div>
          <div class="more-article-meta">${a.category ? a.category + ' · ' : ''}${formatDate(a.date)}</div>
        </div>
        <div class="more-article-arrow">→</div>
      </a>
    `).join('');
    return `
      <div class="more-section">
        <div class="more-eyebrow">More articles</div>
        <div class="more-articles-list">${rows}</div>
      </div>
    `;
  }

  async function loadArticle() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if (!slug) {
      document.getElementById('article-wrapper').innerHTML = '<div class="state-message"><h2>Article not found</h2><p>No article slug provided.</p></div>';
      return;
    }

    try {
      const [articleRes, contentRes] = await Promise.all([
        fetch('/.netlify/functions/get-article?slug=' + encodeURIComponent(slug)),
        fetch('/.netlify/functions/get-content')
      ]);

      if (!articleRes.ok) throw new Error('Not found');
      const { article } = await articleRes.json();
      const { articles = [] } = contentRes.ok ? await contentRes.json() : {};

      document.title = article.title.replace(/<[^>]+>/g, '') + ' — Riccardo Pollacchini';

      document.getElementById('article-wrapper').innerHTML = `
        <div class="article-eyebrow">${article.category || 'Article'}</div>
        <h1 class="article-title">${article.title}</h1>
        <div class="article-meta">
          ${article.date ? '<span>' + formatDate(article.date) + '</span>' : ''}
          ${article.readTime ? '<span>' + article.readTime + '</span>' : ''}
          ${article.category ? '<span class="cat">' + article.category + '</span>' : ''}
        </div>
        <div class="article-body">
          ${formatBody(article.body)}
        </div>
        <div class="author-signature">
          <div class="author-top">
            <div class="author-avatar"><img src="/Riccardo_Pollacchini-002_2048px.jpg" alt="Riccardo Pollacchini" /></div>
            <div class="author-info">
              <div class="author-name">Riccardo Pollacchini</div>
              <div class="author-desc">Head of Business Finance · 5+ years building finance functions at scale-ups. I believe finance should be a growth engine — sharp, fast, and actually fun.</div>
            </div>
          </div>
          <div class="author-cta-row">
            <div class="author-cta-label">Want to discuss this?<br>Let's connect on LinkedIn.</div>
            <a href="https://www.linkedin.com/in/riccardo-pollacchini" target="_blank" class="author-cta-btn">
              <svg viewBox="0 0 24 24" fill="white" width="14" height="14"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
              Connect on LinkedIn
            </a>
          </div>
        </div>
        ${renderMoreArticles(articles, slug)}
      `;
    } catch (e) {
      document.getElementById('article-wrapper').innerHTML = '<div class="state-message"><h2>Article not found</h2><p>This article doesn\'t exist or hasn\'t been published yet.</p></div>';
    }
  }

  loadArticle();
</script>
</body>
</html>
