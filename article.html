<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — Riccardo Pollacchini</title>

  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://pollacchini.com/" />
  <meta property="og:image" content="https://pollacchini.com/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #111110;
      --paper: #F7F5F0;
      --warm: #E8603A;
      --warm-light: #FDF0EC;
      --muted: #7A7870;
      --border: #E2DFD8;
      --card: #FFFFFF;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-weight: 300;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 48px;
      background: rgba(247, 245, 240, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 18px; font-weight: 700;
      color: var(--ink); text-decoration: none;
      letter-spacing: -0.02em;
    }
    .nav-logo span { color: var(--warm); }
    .nav-back {
      font-size: 13px; font-weight: 400; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted);
      text-decoration: none; transition: color 0.2s;
    }
    .nav-back:hover { color: var(--warm); }

    /* ── ARTICLE ── */
    .article-wrapper {
      max-width: 720px;
      margin: 0 auto;
      padding: 140px 48px 100px;
    }

    .article-eyebrow {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-mono); font-size: 11px;
      color: var(--warm); letter-spacing: 0.12em; text-transform: uppercase;
      margin-bottom: 20px;
    }
    .article-eyebrow::after {
      content: ''; flex: 1; max-width: 60px;
      height: 1px; background: var(--warm);
    }

    .article-title {
      font-family: var(--font-display);
      font-size: clamp(32px, 5vw, 56px);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .article-meta {
      display: flex; align-items: center; gap: 20px;
      font-size: 13px; color: var(--muted);
      margin-bottom: 56px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }
    .article-meta .cat {
      color: var(--warm); font-weight: 500;
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    }

    .article-body {
      font-size: 17px;
      line-height: 1.85;
      color: #2A2A28;
    }

    .article-body p {
      margin-bottom: 24px;
    }

    .article-body h2 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin: 48px 0 16px;
      line-height: 1.2;
    }

    .article-body h3 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      margin: 36px 0 12px;
    }

    .article-body strong {
      color: var(--ink);
      font-weight: 500;
    }

    .article-body em {
      font-style: italic;
      color: var(--warm);
    }

    .article-footer {
      margin-top: 64px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 16px;
    }

    .share-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--warm); color: #fff;
      padding: 12px 24px; border-radius: 4px;
      font-size: 13px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; border: none; cursor: pointer;
      transition: background 0.2s; font-family: var(--font-body);
      text-decoration: none;
    }
    .share-btn:hover { background: #C94E2C; }

    .back-link {
      font-size: 13px; color: var(--muted); text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--warm); }

    /* ── LOADING / ERROR ── */
    .state-message {
      text-align: center;
      padding: 80px 0;
      color: var(--muted);
      font-size: 16px;
    }
    .state-message h2 {
      font-family: var(--font-display);
      font-size: 32px; font-weight: 700;
      color: var(--ink); margin-bottom: 12px;
    }

    @media (max-width: 900px) {
      nav { padding: 16px 24px; }
      .article-wrapper { padding: 120px 24px 60px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">R.<span>P</span></a>
  <a href="/#articles" class="nav-back">← All articles</a>
</nav>

<div class="article-wrapper" id="article-wrapper">
  <div class="state-message" id="loading">
    <p>Loading article…</p>
  </div>
</div>

<script>
  function formatDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function shareOnLinkedIn(title) {
    const url = encodeURIComponent('https://pollacchini.com');
    const text = encodeURIComponent(`${title} — by Riccardo Pollacchini on pollacchini.com`);
    window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${url}&summary=${text}`, '_blank', 'width=600,height=500');
  }

  // Convert plain body text into formatted HTML paragraphs
  // Detects ALL-CAPS lines as headings
  function formatBody(text) {
    if (!text) return '';
    const paragraphs = text.split('\n').filter(p => p.trim().length > 0);
    return paragraphs.map(p => {
      const trimmed = p.trim();
      // All-caps lines (at least 4 words) → h2 heading
      if (trimmed === trimmed.toUpperCase() && trimmed.split(' ').length >= 3 && trimmed.length > 10) {
        // Title-case the heading for display
        const titled = trimmed.split(' ').map(w => w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
        return `<h2>${titled}</h2>`;
      }
      // Lines starting with common sub-heading patterns → h3
      if (/^(Base Layer|Middle Layer|Top Layer|First,|Second,|Third,)/.test(trimmed)) {
        return `<h3>${trimmed}</h3>`;
      }
      return `<p>${trimmed}</p>`;
    }).join('\n');
  }

  async function loadArticle() {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');

    if (!slug) {
      document.getElementById('article-wrapper').innerHTML = `
        <div class="state-message">
          <h2>Article not found</h2>
          <p>No article slug provided.</p>
          <br><a href="/#articles" class="back-link">← Back to articles</a>
        </div>`;
      return;
    }

    try {
      const res = await fetch(`/.netlify/functions/get-article?slug=${encodeURIComponent(slug)}`);
      if (!res.ok) throw new Error('Not found');
      const { article } = await res.json();

      // Update page title and OG tags
      document.title = `${article.title} — Riccardo Pollacchini`;
      document.querySelector('meta[property="og:url"]').setAttribute('content', `https://pollacchini.com/article?slug=${slug}`);

      document.getElementById('article-wrapper').innerHTML = `
        <div class="article-eyebrow">${article.category || 'Article'}</div>
        <h1 class="article-title">${article.title}</h1>
        <div class="article-meta">
          ${article.date ? `<span>${formatDate(article.date)}</span>` : ''}
          ${article.readTime ? `<span>${article.readTime}</span>` : ''}
          <span class="cat">${article.category || ''}</span>
        </div>
        <div class="article-body">
          ${formatBody(article.body)}
        </div>
        <div class="article-footer">
          <a href="/#articles" class="back-link">← Back to articles</a>
          <button class="share-btn" onclick="shareOnLinkedIn(${JSON.stringify(article.title)})">
            <svg viewBox="0 0 24 24" fill="white" width="14" height="14"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
            Share on LinkedIn
          </button>
        </div>
      `;
    } catch (e) {
      document.getElementById('article-wrapper').innerHTML = `
        <div class="state-message">
          <h2>Article not found</h2>
          <p>This article doesn't exist or hasn't been published yet.</p>
          <br><a href="/#articles" class="back-link">← Back to articles</a>
        </div>`;
    }
  }

  loadArticle();
</script>
</body>
</html>
