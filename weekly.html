<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Brief — Riccardo Pollacchini</title>
  <meta property="og:type" content="article" />
  <meta property="og:image" content="https://pollacchini.com/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #111110;
      --paper: #F7F5F0;
      --accent: #2E2EFF;
      --yellow: #FFFF00;
      --muted: #7A7870;
      --border: #E2DFD8;
      --card: #FFFFFF;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-weight: 300; line-height: 1.7; -webkit-font-smoothing: antialiased; overflow-x: hidden; }

    /* NAV */
    nav { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; background: rgba(247,245,240,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    .back-btn-round { width: 40px; height: 40px; border-radius: 50%; background: transparent; border: 2px solid var(--accent, #2E2EFF); display: flex; align-items: center; justify-content: center; text-decoration: none; transition: transform 0.15s, background 0.2s; flex-shrink: 0; }
    .back-btn-round:hover { background: var(--yellow, #FFFF00); transform: translateX(-2px); }
    .nav-logo { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: -0.02em; }
    .nav-logo span { color: var(--accent); }

    /* WRAPPER */
    .brief-wrapper { max-width: 720px; margin: 0 auto; padding: 48px 48px 100px; }

    /* BRIEF STYLES */
    .brief-header { border-bottom: 2px solid #E2DFD8; padding-bottom: 16px; margin-bottom: 28px; }
    .brief-eyebrow { font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
    .brief-headline { font-family: var(--font-display); font-size: clamp(24px, 4vw, 36px); font-weight: 700; color: var(--ink); letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 8px; }
    .brief-meta { font-size: 12px; color: var(--muted); }

    .section { margin-bottom: 32px; }
    .section-label { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-trend { background: #7F77DD; }
    .dot-arr { background: #1D9E75; }
    .dot-margin { background: #EF9F27; }
    .dot-capital { background: #378ADD; }
    .dot-innov { background: #D85A30; }
    .dot-cfo { background: #D4537E; }
    .dot-read { background: #888780; }

    .signal { background: var(--card); border-left: 3px solid #E2DFD8; border-radius: 0 8px 8px 0; padding: 12px 16px; margin-bottom: 10px; border: 1px solid var(--border); border-left-width: 3px; }
    .signal.hot { border-left-color: #D85A30; }
    .signal.growth { border-left-color: #1D9E75; }
    .signal.caution { border-left-color: #EF9F27; }
    .signal.info { border-left-color: #378ADD; }
    .signal.purple { border-left-color: #7F77DD; }
    .signal-title { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 4px; }
    .signal-body { font-size: 13px; color: var(--muted); line-height: 1.65; }
    .signal-body strong { color: var(--ink); font-weight: 500; }

    .tag { display: inline-block; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; margin-right: 4px; margin-top: 8px; }
    .tag-hot { background: #FAECE7; color: #993C1D; }
    .tag-up { background: #E1F5EE; color: #0F6E56; }
    .tag-warn { background: #FAEEDA; color: #854F0B; }
    .tag-blue { background: #E6F1FB; color: #185FA5; }
    .tag-purple { background: #EEEDFE; color: #534AB7; }

    .cfo-q { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; display: flex; gap: 14px; align-items: flex-start; }
    .q-num { font-size: 22px; font-weight: 700; color: var(--border); flex-shrink: 0; line-height: 1; font-family: var(--font-display); }
    .q-text { font-size: 14px; color: var(--ink); line-height: 1.6; font-weight: 500; }
    .q-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .divider { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    .read-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; margin-bottom: 10px; }
    .read-num { font-size: 10px; font-weight: 500; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
    .read-title { font-size: 14px; font-weight: 500; color: var(--ink); margin-bottom: 5px; }
    .read-why { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
    .read-link { font-size: 12px; color: var(--accent); text-decoration: none; }
    .read-link:hover { text-decoration: underline; }
    .read-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .brief-sources { font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px; }

    /* AUTHOR */
    .author-signature { margin-top: 48px; padding: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; gap: 0; }
    .author-top { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; }
    .author-cta-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 18px; border-top: 1px solid var(--border); }
    .author-cta-label { font-size: 14px; color: var(--muted); line-height: 1.5; }
    .author-avatar { width: 72px; height: 72px; border-radius: 50%; background: var(--yellow); border: 3px solid var(--yellow); flex-shrink: 0; overflow: hidden; }
    .author-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 15%; }
    .author-name { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
    .author-desc { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
    .author-linkedin { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); text-decoration: none; transition: opacity 0.2s; }
    .author-linkedin:hover { opacity: 0.7; }

    /* BRIEF NAVIGATION */
    .brief-nav {
      margin-top: 48px;
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .brief-nav-btn {
      display: flex; flex-direction: column;
      padding: 20px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--card);
      text-decoration: none; color: inherit;
      transition: border-color 0.2s, transform 0.15s;
    }
    .brief-nav-btn:hover { border-color: var(--accent); transform: translateY(-2px); }
    .brief-nav-btn.next { align-items: flex-end; text-align: right; }
    .brief-nav-label {
      font-family: var(--font-mono); font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 6px;
    }
    .brief-nav-title {
      font-family: var(--font-display); font-size: 16px;
      font-weight: 700; color: var(--ink);
      line-height: 1.2; letter-spacing: -0.02em;
    }
    .brief-nav-issue {
      font-size: 11px; color: var(--accent);
      margin-top: 4px; font-weight: 500;
    }
    .brief-nav-btn.disabled {
      opacity: 0.3; pointer-events: none;
    }

    .author-cta-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff;
      padding: 10px 20px; border-radius: 4px;
      font-size: 12px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; text-decoration: none;
      margin-top: 14px;
      transition: background 0.2s, transform 0.15s;
    }
    .author-cta-btn:hover { background: #1a1acc; transform: translateY(-1px); }

    .state-message { text-align: center; padding: 80px 0; color: var(--muted); font-size: 16px; }
    .state-message h2 { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--ink); margin-bottom: 12px; }

    @media (max-width: 900px) {
      nav { padding: 16px 24px; }
      .brief-wrapper { padding: 40px 24px 60px; }
      .author-top { flex-direction: column; text-align: center; }
      .author-avatar { margin: 0 auto; }
      .author-cta-row { flex-direction: column; align-items: center; text-align: center; }
      .author-cta-btn { width: 100%; justify-content: center; }
      .brief-nav { grid-template-columns: 1fr; }
      .brief-nav-btn.next { align-items: flex-start; text-align: left; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/#weekly" class="back-btn-round" aria-label="Back"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E2EFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
  <a href="/" class="nav-logo">R<span style="color:#2E2EFF;">P</span></a>
</nav>

<div class="brief-wrapper" id="brief-wrapper">
  <div class="state-message"><p>Loading brief…</p></div>
</div>

<script>
  const LI_SVG = '<svg viewBox="0 0 24 24" fill="white" width="14" height="14"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';
  const LI_SVG_INK = '<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';

  function formatDate(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function renderSignals(raw) {
    if (!raw) return '<p style="color:var(--muted);font-size:13px;">Coming soon.</p>';
    return raw.split('\n---\n').map(s => {
      const parts = s.split('|');
      const type = (parts[0] || '').trim();
      let title, body, tagClass, tagLabel;
      if (parts.length >= 5) {
        title = parts[1].trim(); body = parts[2].trim();
        tagClass = parts[3].trim(); tagLabel = parts[4].trim();
      } else {
        body = (parts[1] || '').trim(); tagClass = (parts[2] || '').trim();
        tagLabel = (parts[3] || '').trim(); title = '';
      }
      const tag = tagClass && tagLabel ? `<span class="tag ${tagClass}">${tagLabel}</span>` : '';
      return `<div class="signal ${type}">
        ${title ? `<div class="signal-title">${title}</div>` : ''}
        <div class="signal-body">${body} ${tag}</div>
      </div>`;
    }).join('');
  }

  function renderCFOQuestions(raw) {
    if (!raw) return '<p style="color:var(--muted);font-size:13px;">Coming soon.</p>';
    return raw.split('\n---\n').map((s, i) => {
      const pipeIdx = s.indexOf('|');
      const question = pipeIdx >= 0 ? s.slice(0, pipeIdx).trim() : s.trim();
      const tagStr = pipeIdx >= 0 ? s.slice(pipeIdx + 1).trim() : '';
      const isNewFormat = tagStr && /tag-[a-z]+:[^·]+/.test(tagStr);
      let subHtml = '';
      if (isNewFormat) {
        const tagPills = tagStr.split('·').map(t => {
          const colonIdx = t.indexOf(':');
          if (colonIdx < 0) return '';
          const cls = t.slice(0, colonIdx).trim();
          const label = t.slice(colonIdx + 1).trim();
          return cls && label ? `<span class="tag ${cls}">${label}</span>` : '';
        }).join(' ');
        subHtml = tagPills ? `<div class="q-sub" style="margin-top:8px;">${tagPills}</div>` : '';
      } else if (tagStr) {
        subHtml = `<div class="q-sub">${tagStr}</div>`;
      }
      return `<div class="cfo-q"><div class="q-num">0${i+1}</div><div><div class="q-text">${question}</div>${subHtml}</div></div>`;
    }).join('');
  }

  function renderMustRead(raw) {
    if (!raw) return '<p style="color:var(--muted);font-size:13px;">Coming soon.</p>';
    return raw.split('\n---\n').map((s, i) => {
      const parts = s.split('|');
      const date = (parts[0] || '').trim(); const cat = (parts[1] || '').trim();
      const title = (parts[2] || '').trim(); const why = (parts[3] || '').trim();
      const url = (parts[4] || '').trim(); const source = (parts[5] || '').trim();
      const readtime = (parts[6] || '').trim();
      const num = String(i + 1).padStart(2, '0');
      return `<div class="read-card">
        <div class="read-num">Article ${num} · ${cat} · ${date}</div>
        <div class="read-title">${title}</div>
        <div class="read-why">${why}</div>
        ${url ? `<a class="read-link" href="${url}" target="_blank">${source} → Read article</a>` : ''}
        <div class="read-meta">${source}${readtime ? ' · ~' + readtime : ''}</div>
      </div>`;
    }).join('');
  }

  function renderBriefNav(allBriefs, currentIssue) {
    const sorted = [...allBriefs].sort((a, b) => a.issue - b.issue);
    const idx = sorted.findIndex(b => b.issue === currentIssue);
    const prev = idx > 0 ? sorted[idx - 1] : null;
    const next = idx >= 0 && idx < sorted.length - 1 ? sorted[idx + 1] : null;

    const prevHtml = prev
      ? `<a class="brief-nav-btn prev" href="/weekly?issue=${prev.issue}">
          <div class="brief-nav-label">← Previous brief</div>
          <div class="brief-nav-title">${(prev.headline || prev.title).replace(/<[^>]+>/g, '')}</div>
          <div class="brief-nav-issue">Issue #${String(prev.issue).padStart(2,'0')}</div>
        </a>`
      : `<div class="brief-nav-btn prev disabled">
          <div class="brief-nav-label">← Previous brief</div>
          <div class="brief-nav-title">This is the first issue</div>
        </div>`;

    const nextHtml = next
      ? `<a class="brief-nav-btn next" href="/weekly?issue=${next.issue}">
          <div class="brief-nav-label">Next brief →</div>
          <div class="brief-nav-title">${(next.headline || next.title).replace(/<[^>]+>/g, '')}</div>
          <div class="brief-nav-issue">Issue #${String(next.issue).padStart(2,'0')}</div>
        </a>`
      : `<div class="brief-nav-btn next disabled">
          <div class="brief-nav-label">Next brief →</div>
          <div class="brief-nav-title">You're on the latest issue</div>
        </div>`;

    return `<div class="brief-nav">${prevHtml}${nextHtml}</div>`;
  }

  async function loadBrief() {
    const params = new URLSearchParams(window.location.search);
    const issue = params.get('issue');
    if (!issue) {
      document.getElementById('brief-wrapper').innerHTML = '<div class="state-message"><h2>Brief not found</h2><p>No issue number provided.</p></div>';
      return;
    }
    try {
      const [briefRes, contentRes] = await Promise.all([
        fetch('/.netlify/functions/get-weekly?issue=' + encodeURIComponent(issue)),
        fetch('/.netlify/functions/get-content')
      ]);

      if (!briefRes.ok) throw new Error('Not found');
      const { brief } = await briefRes.json();
      const { weekly: allBriefs = [] } = contentRes.ok ? await contentRes.json() : {};

      document.title = 'Week ' + brief.issue + ': ' + (brief.headline || brief.title).replace(/<[^>]+>/g, '') + ' — Riccardo Pollacchini';

      document.getElementById('brief-wrapper').innerHTML = `
        <div class="brief-header">
          <div class="brief-eyebrow">Weekly External Signals Brief</div>
          <div class="brief-headline">${brief.headline || brief.title}</div>
          <div class="brief-meta">Week ${brief.issue} &nbsp;·&nbsp; Business Finance &nbsp;·&nbsp; Copenhagen &nbsp;·&nbsp; ${formatDate(brief.date)}</div>
        </div>

        <div class="section">
          <div class="section-label"><span class="dot dot-trend"></span>1 — Trending</div>
          ${renderSignals(brief.trending)}
        </div>
        <hr class="divider">

        <div class="section">
          <div class="section-label"><span class="dot dot-arr"></span>2 — ARR</div>
          ${renderSignals(brief.arr)}
        </div>
        <hr class="divider">

        <div class="section">
          <div class="section-label"><span class="dot dot-margin"></span>3 — Margin Guardrails</div>
          ${renderSignals(brief.marginGuardrails)}
        </div>
        <hr class="divider">

        <div class="section">
          <div class="section-label"><span class="dot dot-capital"></span>4 — Capital Structure</div>
          ${renderSignals(brief.capitalStructure)}
        </div>
        <hr class="divider">

        <div class="section">
          <div class="section-label"><span class="dot dot-innov"></span>5 — Innovation & New Ideas</div>
          ${renderSignals(brief.innovation)}
        </div>
        <hr class="divider">

        <div class="section">
          <div class="section-label"><span class="dot dot-cfo"></span>6 — CFO Strategic Questions</div>
          ${renderCFOQuestions(brief.cfoQuestions)}
        </div>
        <hr class="divider">

        <div class="section">
          <div class="section-label"><span class="dot dot-read"></span>7 — 3 Must-Read Articles This Week</div>
          ${renderMustRead(brief.mustRead)}
        </div>

        ${brief.sources ? `<div class="brief-sources">${brief.sources}</div>` : ''}

        <div class="author-signature">
          <div class="author-top">
            <div class="author-avatar"><img src="/Riccardo_Pollacchini-002_2048px.jpg" alt="Riccardo Pollacchini" /></div>
            <div>
              <div class="author-name">Riccardo Pollacchini</div>
              <div class="author-desc">Head of Business Finance · 5+ years building finance functions at scale-ups. Weekly signals for finance leaders who want to stay sharp.</div>
            </div>
          </div>
          <div class="author-cta-row">
            <div class="author-cta-label">Have a take on this week's signals?<br>Let's talk on LinkedIn.</div>
            <a href="https://www.linkedin.com/in/riccardo-pollacchini" target="_blank" class="author-cta-btn">
              <svg viewBox="0 0 24 24" fill="white" width="14" height="14"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
              Connect on LinkedIn
            </a>
          </div>
        </div>

        ${allBriefs.length > 1 ? renderBriefNav(allBriefs, brief.issue) : ''}
      `;
    } catch(e) {
      document.getElementById('brief-wrapper').innerHTML = '<div class="state-message"><h2>Brief not found</h2><p>This issue doesn\'t exist or hasn\'t been published yet.</p></div>';
    }
  }

  loadBrief();
</script>
</body>
</html>
